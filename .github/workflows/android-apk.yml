name: Android APK (MiniCoder Brain)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write       # lets the failure step post build logs to issue #6

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (pinned — Chaquopy 16 needs 8.x)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Probe Chaquopy wheel index for numpy (cp311/arm64)
        run: |
          # Chaquopy only ships prebuilt wheels for specific numpy versions;
          # building numpy from source on Android is impossible.  Ask their
          # index which cp311 wheels exist and pin that exact version.
          for idx in pypi-13 pypi-7.0 pypi-13.2 pypi-16; do
            curl -s "https://chaquo.com/$idx/numpy/" -o npindex.html && break
          done
          grep -oE 'numpy-[0-9][0-9.]*-[^"#]*cp311[^"#]*arm64_v8a[^"#]*\.whl' npindex.html | sort -u > npwheels.txt || true
          echo "::wheel candidates::"; cat npwheels.txt
          VER=$(grep -oE 'numpy-[0-9][0-9.]*' npwheels.txt | sed 's/numpy-//' | sort -V | tail -n1 || true)
          if [ -n "$VER" ]; then
            echo "pinning numpy==$VER"
            sed -i "s|install 'numpy[^']*'|install 'numpy==$VER'|" android/app/build.gradle
          else
            echo "no cp311 numpy wheel found in index listing; leaving unpinned so Chaquopy resolves"
            sed -i "s|install 'numpy[^']*'|install 'numpy'|" android/app/build.gradle
          fi
          grep -n numpy android/app/build.gradle

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon 2>&1 | tee build.log | tail -n 60
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Post build log on failure
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '```' > body.md
          grep -B5 "For assistance, please raise" build.log | tail -n 60 >> body.md || true
          echo '--- grep ---' >> body.md
          grep -nE "FAILURE|What went wrong|ERROR|Could not find|No matching" build.log | tail -n 40 >> body.md || true
          echo '```' >> body.md
          gh issue comment 6 --repo $GITHUB_REPOSITORY --body-file body.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minicoder-brain-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
