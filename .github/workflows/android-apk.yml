name: Android APK (MiniCoder Brain)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write       # lets the failure step post build logs to issue #6

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (pinned — Chaquopy 16 needs 8.x)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log | tail -n 200
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Post build log on failure
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '```' > body.md
          tail -n 120 build.log >> body.md || true
          echo '```' >> body.md
          gh issue comment 6 --repo $GITHUB_REPOSITORY --body-file body.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minicoder-brain-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
