plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.minicoder.brain'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.minicoder.brain'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0-offline'

        // phone-first ABIs; keeps the debug APK lean (~35 MB)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }

        python {
            version '3.11'
            pip {
                install 'numpy==1.26.4'   // brain math runtime (bundled)
            }
        }
    }
}
