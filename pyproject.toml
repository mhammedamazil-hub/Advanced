[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "minicoder"
version = "0.1.0"
description = "MINICODER: a tiny, brain-inspired, self-learning coding intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["minicoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: slower verification probes (still <60s)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
